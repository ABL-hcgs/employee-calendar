<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f0f4f8; 
            /* URL Background telah diperbaiki (tanpa .com) */
            background-image: url('https://i.ibb.co/BH4L0grj/background-2.png'); 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center top; 
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-800 p-4 sm:p-8 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-7xl">
        <!-- HEADER UTAMA -->
        <div class="bg-white/95 backdrop-blur-md rounded-[2rem] shadow-sm p-5 sm:px-8 sm:py-6 mb-6 flex flex-wrap justify-between items-center border border-gray-100">
            <div class="flex items-center gap-4">
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                    <img src="https://i.ibb.co/8n6crmsy/logo-people-manager.png" alt="logo" class="h-8">
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight"><span class="text-blue-600">People</span><span class="text-orange-500">Calendar</span></h1>
                    <p class="text-xs text-gray-500 font-semibold mt-0.5">Good Morning, Team!</p>
                </div>
            </div>
            <div class="flex items-center gap-4 mt-4 sm:mt-0">
                <div class="flex items-center gap-2 bg-green-50 text-green-600 px-4 py-2 rounded-full font-bold text-xs border border-green-200">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> Connected
                </div>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md transition transform hover:scale-105" title="Add Event">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- KALENDER & DASHBOARD -->
        <div class="bg-white/95 backdrop-blur-md rounded-[2rem] shadow-sm p-6 sm:p-8 border border-gray-100">
            
            <!-- DASHBOARD INITIAL PLAN -->
            <div class="mb-8 bg-gray-50 rounded-2xl p-5 border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h2 id="monthlyPlanTitleUI" class="text-base font-bold text-gray-700"><i class="fas fa-clipboard-list text-blue-500 mr-2"></i>Initial Plan Event</h2>
                    <span class="text-[10px] font-bold bg-white text-gray-500 px-3 py-1 rounded-full border border-gray-200 uppercase tracking-wide">Execution Timeline</span>
                </div>
                <div id="monthlyPlanContentUI" class="text-sm grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
            </div>

            <!-- HEADER KALENDER -->
            <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
                <h2 id="currentMonthYear" class="text-4xl font-extrabold text-gray-800 tracking-tight"></h2>
                <div class="flex items-center gap-1 bg-gray-50 border border-gray-200 rounded-full p-1 shadow-sm">
                    <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white hover:shadow text-gray-600 transition"><i class="fas fa-chevron-left"></i></button>
                    <span class="px-4 font-bold text-gray-700 text-sm cursor-pointer" onclick="goToToday()">Today</span>
                    <button onclick="changeMonth(1)" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white hover:shadow text-gray-600 transition"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <!-- GRID KALENDER -->
            <div class="grid grid-cols-7 text-center text-xs font-extrabold text-gray-400 mb-4 tracking-widest uppercase">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendar" class="grid grid-cols-7 bg-gray-100 border-t border-l border-gray-200 rounded-xl overflow-hidden"></div>
            
        </div>
    </div>

    <!-- MODAL FORM TAMBAH -->
    <div id="eventModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex justify-center items-center z-50">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg p-8">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Add New Event</h2>
            <form id="eventForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Category</label>
                        <select id="eventCategory" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-3 text-sm font-medium focus:ring-blue-500 focus:border-blue-500" required>
                            <option value="Event">General Event</option><option value="Birthday">Birthday</option><option value="Holiday">Holiday</option><option value="Physical">Physical</option><option value="Emotional">Emotional</option><option value="Financial">Financial</option><option value="Spiritual">Spiritual</option><option value="Social">Social</option><option value="Environment">Environment</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Date</label>
                        <input type="date" id="eventDate" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-3 text-sm font-medium focus:ring-blue-500" required>
                    </div>
                </div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Title / Name</label><input type="text" id="eventTitle" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-3 text-sm font-medium focus:ring-blue-500" required></div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1"><label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Emp. ID</label><input type="text" id="eventEmpId" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-3 text-sm font-medium focus:ring-blue-500"></div>
                    <div class="col-span-2"><label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Position</label><input type="text" id="eventPosition" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-3 text-sm font-medium focus:ring-blue-500"></div>
                </div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Dept</label><input type="text" id="eventDirectorate" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-3 text-sm font-medium focus:ring-blue-500"></div>
                <div><label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Description</label><textarea id="eventDesc" rows="2" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-3 text-sm font-medium focus:ring-blue-500"></textarea></div>
                <div class="flex justify-end space-x-3 mt-8">
                    <button type="button" onclick="closeModal()" class="px-6 py-2.5 rounded-full text-gray-600 hover:bg-gray-100 font-bold text-sm transition">Cancel</button>
                    <button type="submit" id="btnSave" class="px-6 py-2.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 font-bold text-sm shadow-md transition">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DETAIL & HAPUS -->
    <div id="detailModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex justify-center items-center z-50">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 relative overflow-hidden">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition bg-gray-50 w-8 h-8 rounded-full flex items-center justify-center">
                <i class="fas fa-times"></i>
            </button>
            <div id="detailContent" class="mb-6"></div>
            <div class="flex flex-col space-y-3">
                <button id="btnSendEmail" class="w-full bg-[#2563eb] hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2 shadow-sm">
                    <i class="fas fa-paper-plane"></i> Kirim Email Manual
                </button>
                <button id="btnDeleteEvent" class="w-full bg-[#ffe4e6] hover:bg-red-200 text-red-600 border border-red-200 py-3 rounded-xl font-bold text-sm transition flex justify-center items-center gap-2">
                    <i class="fas fa-trash-alt"></i> Resign / Delete Event
                </button>
            </div>
            <p id="emailStatus" class="text-xs text-center mt-3 font-semibold"></p>
        </div>
    </div>

    <script>
        // URL SCRIPT ANDA SUDAH TERPASANG DI SINI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxHFr_gXVb9q0kGX0Q7ap6RcYOKiK_WONtIrw8d_hUAmGe9Bocat1YhwcagmfgToEFq/exec'; 

        let events = [], planData = [];
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        let selectedEventForEmail = null;

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const planMonthHeaders = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        function formatDate(dateString) {
            if(!dateString) return "";
            const d = new Date(dateString);
            if(isNaN(d)) return dateString;
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        async function fetchEvents() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                // MAPPING ANTI-ERROR UNTUK HURUF BESAR/KECIL
                events = data.events.map(item => {
                    const findVal = (keyName) => {
                        const foundKey = Object.keys(item).find(k => k.toLowerCase() === keyName.toLowerCase());
                        return foundKey ? item[foundKey] : '';
                    };
                    return {
                        id: findVal('id'), 
                        title: findVal('title'), 
                        date: formatDate(findVal('date')), 
                        category: findVal('category') || 'Event', 
                        description: findVal('description'),
                        emp_id: findVal('emp_id'), 
                        position: findVal('position'), 
                        directorate: findVal('directorate')
                    };
                });
                planData = data.plan;

            } catch (error) {
                console.warn("Memuat Mode Preview Dummy...");
                const nmBulan = planMonthHeaders[currentMonth]; 
                planData = [
                    { "Cluster Event": "Emotional", "Event": "Employee Birthday", [nmBulan]: "Yes" },
                    { "Cluster Event": "Physical", "Event": "Tennis & Padel", [nmBulan]: "Yes" }
                ];
                events = [{ id: "DUMMY1", title: "Agustinus Sampe", date: formatDate(new Date()), category: "Birthday", description: "-", emp_id: "25000026", position: "-", directorate: "Human Resources & General Services" }];
            } finally {
                renderCalendar();
            }
        }

        function renderMonthlyPlan() {
            document.getElementById('monthlyPlanTitleUI').innerHTML = `<i class="fas fa-clipboard-list text-blue-500 mr-2"></i>Initial Plan Event - ${monthNames[currentMonth]} ${currentYear}`;
            const monthKey = planMonthHeaders[currentMonth]; 
            let grouped = {};

            if(planData && planData.length > 0) {
                planData.forEach(p => {
                    let cellValue = p[monthKey] ? p[monthKey].toString().trim().toLowerCase() : '';
                    if(cellValue === 'yes') {
                        let cat = p['Cluster Event'] || 'Others';
                        if (!grouped[cat]) grouped[cat] = new Set();
                        grouped[cat].add(p['Event']);
                    }
                });
            }

            let html = '';
            if (Object.keys(grouped).length === 0) {
                html = '<p class="text-xs font-medium text-gray-400 italic col-span-full">Tidak ada rencana untuk bulan ini berdasarkan Matriks.</p>';
            } else {
                for (let cat in grouped) {
                    let items = Array.from(grouped[cat]).join(', ');
                    let tagColor = 'bg-gray-100 text-gray-700';
                    let catLower = cat.toLowerCase();
                    if(catLower.includes('emotional')) tagColor = 'bg-[#f3e8ff] text-[#7e22ce]';
                    else if(catLower.includes('physical')) tagColor = 'bg-[#fef9c3] text-[#a16207]';
                    else if(catLower.includes('environmental')) tagColor = 'bg-[#ccfbf1] text-[#0f766e]';
                    else if(catLower.includes('financial')) tagColor = 'bg-[#fce7f3] text-[#be185d]';
                    
                    html += `
                    <div class="flex items-start bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                        <span class="inline-block px-3 py-1 ${tagColor} text-[10px] font-extrabold rounded min-w-[90px] text-center mr-3 uppercase tracking-wide">${cat}</span>
                        <span class="text-gray-600 text-xs font-semibold pt-0.5 leading-relaxed">${items}</span>
                    </div>`;
                }
            }
            document.getElementById('monthlyPlanContentUI').innerHTML = html;
        }

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            const monthYear = document.getElementById('currentMonthYear');
            calendar.innerHTML = '';
            monthYear.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date(); today.setHours(0,0,0,0);

            for (let i = 0; i < firstDay; i++) calendar.innerHTML += `<div class="bg-white min-h-[140px] p-2 border-r border-b border-gray-200 opacity-50"></div>`;

            for (let day = 1; day <= daysInMonth; day++) {
                const dayEvents = events.filter(e => {
                    if(!e.date) return false;
                    const eDate = new Date(e.date);
                    if (e.category.toLowerCase() === 'birthday') return eDate.getDate() === day && eDate.getMonth() === currentMonth;
                    return eDate.getDate() === day && eDate.getMonth() === currentMonth && eDate.getFullYear() === currentYear;
                });

                let eventsHTML = '<div class="mt-2 space-y-1">';
                dayEvents.forEach(e => {
                    let cat = e.category.toLowerCase();
                    let pillStyle = "bg-blue-50 text-blue-700 border border-blue-100 hover:bg-blue-100";
                    let icon = "fa-calendar-check";
                    
                    if(cat === 'birthday') { pillStyle = "bg-[#fff7ed] text-[#ea580c] border border-[#ffedd5] hover:bg-[#ffedd5]"; icon = "fa-birthday-cake"; }
                    else if(cat === 'holiday') { pillStyle = "bg-green-50 text-green-700 border border-green-100 hover:bg-green-100"; icon = "fa-tree"; }
                    
                    eventsHTML += `
                    <div class="px-2 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1.5 shadow-sm truncate cursor-pointer transition ${pillStyle}" onclick='showEventDetail(${JSON.stringify(e).replace(/'/g, "&apos;")})'>
                        <i class="fas ${icon} opacity-80"></i> <span class="truncate">${e.title}</span>
                    </div>`;
                });
                eventsHTML += '</div>';

                let isToday = (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
                let numberStyle = isToday ? 'bg-blue-600 text-white w-7 h-7 rounded-full flex items-center justify-center' : 'text-gray-500 w-7 h-7 flex items-center justify-center';
                
                calendar.innerHTML += `
                <div class="bg-white min-h-[140px] p-3 border-r border-b border-gray-200 transition hover:bg-gray-50/50">
                    <span class="font-extrabold text-sm mb-1 ${numberStyle}">${day}</span>
                    ${eventsHTML}
                </div>`;
            }
            renderMonthlyPlan(); 
        }

        function changeMonth(delta) { currentMonth += delta; if (currentMonth > 11) { currentMonth = 0; currentYear++; } if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }
        function goToToday() { currentDate = new Date(); currentMonth = currentDate.getMonth(); currentYear = currentDate.getFullYear(); renderCalendar(); }

        function openModal() { document.getElementById('eventModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('eventModal').classList.add('hidden'); document.getElementById('eventForm').reset(); }
        
        function showEventDetail(eventObj) {
            selectedEventForEmail = eventObj;
            let isBday = eventObj.category.toLowerCase() === 'birthday';
            let icon = isBday ? 'fa-birthday-cake text-[#f97316]' : 'fa-calendar-check text-[#3b82f6]';
            
            // Format Info Box yang sangat identik dengan screenshot
            let extraInfo = isBday ? `
                <div class="bg-[#fff7ed] border border-[#ffedd5] rounded-xl p-4 mt-4 space-y-1.5">
                    <p><span class="font-extrabold text-gray-800">Emp ID:</span> ${eventObj.emp_id || '-'}</p>
                    <p><span class="font-extrabold text-gray-800">Position:</span> ${eventObj.position || '-'}</p>
                    <p><span class="font-extrabold text-gray-800">Dept:</span> ${eventObj.directorate || '-'}</p>
                </div>` : '';
                
            document.getElementById('detailContent').innerHTML = `
                <div class="text-center mb-5">
                    <i class="fas ${icon} text-5xl mb-4 drop-shadow-sm"></i>
                    <h3 class="text-xl font-extrabold text-[#1e293b] mb-3">${eventObj.title}</h3>
                    <span class="inline-block px-4 py-1.5 bg-[#f1f5f9] text-[#475569] text-xs rounded-full font-bold shadow-sm">${eventObj.category}</span>
                </div>
                <div class="bg-[#f8fafc] border border-gray-100 rounded-2xl p-5 mb-6 text-sm text-[#334155] space-y-2">
                    <p><span class="font-extrabold text-gray-800">Date:</span> ${eventObj.date}</p>
                    <p><span class="font-extrabold text-gray-800">Desc:</span> ${eventObj.description || '-'}</p>
                    ${extraInfo}
                </div>`;
            document.getElementById('emailStatus').innerText = '';
            document.getElementById('detailModal').classList.remove('hidden');
        }
        
        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        async function sendToGas(payload) {
            return fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).then(res => res.json());
        }

        document.getElementById('eventForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSave'); btn.innerHTML = 'Saving...'; btn.disabled = true;
            const newEvent = { id: "EVT" + new Date().getTime(), title: document.getElementById('eventTitle').value, date: document.getElementById('eventDate').value, category: document.getElementById('eventCategory').value, description: document.getElementById('eventDesc').value, notify_1: '0', notify_2: '0', emp_id: document.getElementById('eventEmpId').value, position: document.getElementById('eventPosition').value, directorate: document.getElementById('eventDirectorate').value };
            try { await sendToGas({ action: 'add', data: newEvent }); closeModal(); fetchEvents(); } catch (error) { alert("Gagal menyimpan data!"); } finally { btn.innerHTML = 'Save Event'; btn.disabled = false; }
        });

        document.getElementById('btnDeleteEvent').addEventListener('click', async function() {
            if(!confirm('Hapus data ini?')) return;
            const btn = this; btn.innerHTML = 'Menghapus...'; btn.disabled = true;
            try { await sendToGas({ action: 'delete', id: selectedEventForEmail.id }); closeDetailModal(); fetchEvents(); } catch (error) { alert("Gagal hapus!"); } finally { btn.innerHTML = '<i class="fas fa-trash-alt"></i> Resign / Delete Event'; btn.disabled = false; }
        });

        document.getElementById('btnSendEmail').addEventListener('click', async function() {
            const btn = this; const statusText = document.getElementById('emailStatus'); btn.innerHTML = 'Mengirim...'; btn.disabled = true; statusText.innerText = "Memproses...";
            try { await sendToGas({ action: 'email', data: selectedEventForEmail }); statusText.innerText = "✅ Sukses Terkirim!"; } catch(e) { statusText.innerText = "❌ Gagal dikirim!"; } finally { btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Email Manual'; btn.disabled = false; }
        });

        fetchEvents();
    </script>
</body>
</html>
